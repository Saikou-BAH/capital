[theme]
base                     = "light"
primaryColor             = "#2563EB"
backgroundColor          = "#F0F4F8"
secondaryBackgroundColor = "#FFFFFF"
textColor                = "#0F172A"
font                     = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
